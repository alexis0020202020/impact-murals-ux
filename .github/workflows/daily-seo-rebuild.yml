name: Daily SEO publish rebuild
# Manual publish trigger: 2026-09-23

on:
  # Also run when this workflow file itself is changed. This gives us a safe
  # one-time bootstrap without creating a commit loop: the job only changes
  # .seo-daily-build, not this workflow file.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-seo-rebuild.yml"
  schedule:
    # 09:10 Asia/Dubai (UTC+4). GitHub cron uses UTC.
    - cron: "10 5 * * *"
    # One-time bootstrap for 23 Sep 2026 at 14:40 Dubai / 10:40 UTC.
    # The script below no-ops this annual expression after 2026.
    - cron: "40 10 23 9 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update daily build marker
        run: |
          if [ "${{ github.event.schedule }}" = "40 10 23 9 *" ] && [ "$(date -u +'%Y')" != "2026" ]; then
            exit 0
          fi
          printf '%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .seo-daily-build

      - name: Commit and push
        run: |
          git config user.name "alexis0020202020"
          git config user.email "esquisse090@gmail.com"
          git add .seo-daily-build
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Daily SEO publishing rebuild"
          git push origin main
